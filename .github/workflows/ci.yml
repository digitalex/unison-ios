name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Pick a simulator
        id: sim
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(p) for p in k.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for k in reversed(ios) for d in devices[k] if d["name"].startswith("iPhone")))')
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          xcodebuild test -scheme Unison \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
